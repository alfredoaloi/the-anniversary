<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un invito, mo chridhe</title>
<meta name="description" content="Una lettera per voi.">
<meta property="og:title" content="Un invito, mo chridhe">
<meta property="og:description" content="Una lettera per voi.">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efe3c8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="colonna">
  <!-- Tutti i testi della testata e della chiusura (data-contenuto) stanno in src/contenuti.js:
       src/testi.js li scrive qui una volta sola all'avvio. Non vanno copiati in questo file. -->
  <header class="testata">
    <div class="sigillo" aria-hidden="true" data-contenuto="sigillo"></div>
    <p class="data" data-contenuto="dataLine"></p>
    <h1 data-contenuto="titolo"></h1>
    <div class="filetto" aria-hidden="true"></div>
  </header>

  <p class="riga-countdown" data-contenuto="rigaCountdown"></p>

  <!-- Area del countdown: l'unica parte della pagina che cambia dopo il caricamento (src/main.js).
       Nome accessibile statico, nessuna regione live: i lettori di schermo non annunciano ogni secondo.
       Nelle fasi giorno e dopo il cartiglio mostra il messaggio al posto dei numeri. -->
  <section class="countdown" role="group" aria-label="Il tempo che resta al Giorno del Romics" data-countdown>
    <ul class="countdown-numeri" data-numeri>
      <li><span class="countdown-valore" data-valore="giorni">–</span> <span class="countdown-etichetta" data-etichetta="giorni">giorni</span></li>
      <li><span class="countdown-valore" data-valore="ore">–</span> <span class="countdown-etichetta" data-etichetta="ore">ore</span></li>
      <li><span class="countdown-valore" data-valore="minuti">–</span> <span class="countdown-etichetta" data-etichetta="minuti">minuti</span></li>
      <li><span class="countdown-valore" data-valore="secondi">–</span> <span class="countdown-etichetta" data-etichetta="secondi">secondi</span></li>
    </ul>
    <p class="countdown-testo" data-testo hidden></p>
  </section>

  <!-- La Missione: lettera e firma stanno in src/contenuti.js (data-contenuto), scritte una volta sola all'avvio.
       Il capolettera è CSS (::first-letter): il testo resta intero. Uguale in tutte le fasi del countdown. -->
  <section class="missione" aria-label="La Missione">
    <p class="lettera" data-contenuto="missione"></p>
    <p class="firma" data-contenuto="firmaMissione"></p>
  </section>

  <!-- Illustrazione: dipinto di Jamie e Claire (img/jamie-e-claire.webp), generato da un prompt originale.
       Il bordo color carta si fonde con la pagina (mix-blend-mode in styles.css). Il testo alternativo la descrive. -->
  <figure class="illustrazione">
    <img src="img/jamie-e-claire.webp" width="878" height="1024" decoding="async"
         alt="Jamie e Claire si tengono per mano a lume di candela, sotto un arco di pietra: lui con i capelli rossi legati, giacca verde e plaid di tartan, lei con i ricci scuri e un abito d'argento">
  </figure>

  <!-- I dieci punti (titolo e riga) stanno in src/contenuti.js: src/preparativi.js riempie l'elenco una
       volta sola all'avvio. Ogni punto è <li class="preparativo" data-preparativo="N"> con il numero
       romano (.preparativo-numero) e un .preparativo-corpo (titolo e riga): il link del punto III
       va in fondo al suo corpo. Nessuna spunta, nessuno stato. -->
  <section class="preparativi">
    <h2>Preparativi</h2>
    <ol class="preparativi-elenco" data-preparativi></ol>
  </section>

  <footer class="chiusura" data-contenuto="chiusura"></footer>
</main>

<!-- Il popup della Sarta: finestra modale nativa (showModal), un solo pulsante, nessuna immagine.
     I testi (data-sarta) stanno in src/contenuti.js: src/sarta.js li scrive una volta sola all'avvio.
     L'unico ingresso è il link «Conoscete la sarta» in fondo al punto III dei Preparativi. -->
<dialog class="sarta" data-sarta-dialog aria-labelledby="sarta-titolo">
  <div class="sarta-carta">
    <h2 class="sarta-titolo" id="sarta-titolo">
      <span class="sarta-intestazione" data-sarta="intestazione"></span>
      <span class="sarta-nome" data-sarta="nome"></span>
    </h2>
    <p class="sarta-riga" data-sarta="riga"></p>
    <div class="filetto" aria-hidden="true"></div>
    <p class="sarta-testo" data-sarta="testo"></p>
    <p class="sarta-azioni"><button type="button" class="sarta-chiudi" data-sarta="chiudi"></button></p>
  </div>
</dialog>

<script type="module" src="src/main.js"></script>
</body>
</html>
